[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlr"
version = "0.1.0"
description = "Retrieval benchmark over Russian codes of law + fine-tuned small embedding model"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rlr.annotate" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic letters in strings/comments are intended

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs model downloads or GPU"]
addopts = "-m 'not slow'"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
