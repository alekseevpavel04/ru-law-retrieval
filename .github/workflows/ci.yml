name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # requirements.txt pins the CUDA build of torch that produced the published numbers; the fast
      # tests (parsing, chunking, filters, splits, metrics, retrieval, bootstrap) run on CPU wheels.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # 9 of the 88 fast tests check the built dataset in data/ and skip on a clean clone
      - run: pytest -q
