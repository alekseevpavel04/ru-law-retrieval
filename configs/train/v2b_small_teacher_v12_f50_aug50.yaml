# v2 grid (scripts/run_v2_grid.py)
experiment: V2
base_model: intfloat/multilingual-e5-small
train_file: train_llm_v12_teacher
negatives: teacher
loss: mnrl
batch_size: 128
mini_batch_size: 32
lr: 3.0e-05
warmup_ratio: 0.1
epochs: 2
eval_every: 0.25
